[project]
name = "salon-agent"
version = "0.1.0"
description = "Salon – LiveKit xAI voice discussion agent worker"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[xai,silero,turn-detector]>=1.5.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
