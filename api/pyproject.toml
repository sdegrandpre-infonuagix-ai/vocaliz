[project]
name = "salon-api"
version = "0.1.0"
description = "Salon – REST API backend (AWS Lambda + API Gateway)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "mangum>=0.19.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.16.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "boto3>=1.38.0",
    "python-dotenv>=1.0.0",
    "slowapi>=0.1.9",
    "livekit-api>=1.2.0",
    "python-multipart>=0.0.20",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.28.0",
    "pypdf>=5.0.0",
    "stripe>=12.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    "moto[sns]>=5.0.0",
]
