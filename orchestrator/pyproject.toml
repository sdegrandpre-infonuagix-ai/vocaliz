[project]
name = "salon-orchestrator"
version = "0.1.0"
description = "Vocaliz – Salon orchestrator (ECS Fargate, one long-lived process per Salon set)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "boto3>=1.38.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.0",
    # Reads the GitHub Actions workflow in test_deployment.py, so that the orchestrator
    # dropping out of the pipeline is a test failure rather than a silent non-deploy.
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
